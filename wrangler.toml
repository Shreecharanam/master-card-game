name = "master-card-game"
main = "worker/src/index.js"
compatibility_date = "2025-09-01"

# Serve the web app (www/) as static assets.
[assets]
directory = "./www"
binding = "ASSETS"

# One Durable Object per game room.
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# One global Durable Object for players + friendships.
[[durable_objects.bindings]]
name = "SOCIAL"
class_name = "Social"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Social"]
