name: Build Android APK

# Builds a debug APK on every push and lets you download it from the run.
# The APK is generated here (cloud) - no laptop needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Allow screen rotation (portrait + landscape)
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          s = re.sub(r'\s*android:screenOrientation="[^"]*"', '', s)
          s = re.sub(r'<activity\b', '<activity android:screenOrientation="fullSensor"', s, count=1)
          open(p, 'w').write(s)
          m = re.search(r'<activity\b[^>]*', s)
          print('activity tag ->', (m.group(0) if m else 'NOT FOUND')[:160])
          PY
          grep -c fullSensor android/app/src/main/AndroidManifest.xml

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: master-card-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
